name: Installation problem
description: Download, first launch, the plug-in not showing up, sideloading
title: "[Install] "
labels: ["install", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't attach photos you don't want to be public.
  - type: dropdown
    id: product
    attributes:
      label: Which app
      options:
        - LRCDF for Mac (Lightroom Classic plug-in)
        - LRCDF for Windows (Lightroom Classic plug-in)
        - Tonewell for Mac
        - Tonewell for iPad
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where did it get stuck?
      options:
        - Download
        - Unzip
        - macOS blocked the first launch
        - Windows security warning or PowerShell install script
        - Joining the CUDA parts (Windows)
        - Could not find "Open Anyway"
        - First-time setup (copying the app and models)
        - Menu not in Lightroom
        - Nothing happens after Start One-Click Retouch
        - iPad sideloading
        - iPad tethering
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact message, or a screenshot
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "e.g. MacBook Air M2, macOS 15.3 / Windows 11 with RTX 4070 / iPad Pro M4, iPadOS 27.0"
    validations:
      required: true
  - type: input
    id: lr
    attributes:
      label: Lightroom Classic version (plug-in only)
      placeholder: "e.g. 14.2 (Help → About)"
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 0.1.5"
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: For the plug-in, the newest .log under ~/LRCDF/plugin_work (Mac) or %USERPROFILE%\LRCDF\plugin_work (Windows)
      render: text
